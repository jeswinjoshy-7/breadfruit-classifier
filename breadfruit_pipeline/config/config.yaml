datasets:
  personal:
    path: "/home/jeswin/data_augmentation/3dataset"
    name: "Personal Dataset"
    description: "Smartphone images from field collection"
    class_labels: ["breadfruit"]
  
  public:
    path: "/home/jeswin/data_augmentation/bread fruit"
    name: "Public Kaggle Dataset"
    description: "~500 breadfruit images from Kaggle"
    class_labels: ["breadfruit"]

output:
  base_dir: "/home/jeswin/data_augmentation/Breadfruit_Dataset"
  structure:
    personal_clean: "Personal_Clean"
    public_clean: "Public_Clean"
    rejected:
      root: "Rejected"
      subdirs:
        - "Duplicates"
        - "Blurry"
        - "Dark"
        - "Bright"
        - "Low_Resolution"
        - "Corrupted"
        - "Needs_Review"
    reports: "Reports"
    logs: "Logs"

image_processing:
  supported_formats: [".jpg", ".jpeg", ".png", ".bmp", ".tiff", ".tif", ".webp"]
  efficientnet_input_size: 224
  target_color_space: "RGB"
  target_format: "JPEG"
  jpeg_quality: 95
  correct_exif_orientation: true
  remove_alpha_channel: true
  preserve_aspect_ratio: true
  padding_color: [0, 0, 0]
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

phase1_inspection:
  enabled: true
  compute_hashes: true

phase2_duplicates:
  enabled: true
  methods:
    - "phash"
    - "dhash"
    - "ahash"
    - "color_histogram"
    - "ssim"
  thresholds:
    phash: 8
    dhash: 8
    ahash: 8
    color_histogram: 0.95
    ssim: 0.95
  consensus_threshold: 3
  move_duplicates: false

phase3_quality:
  enabled: true
  metrics:
    - "blur_score"
    - "sharpness_score"
    - "brightness_score"
    - "contrast_score"
    - "entropy"
    - "noise_estimation"
    - "compression_quality"
    - "resolution"
    - "aspect_ratio"
  thresholds:
    blur_score: 100.0
    sharpness_score: 50.0
    brightness_low: 30.0
    brightness_high: 220.0
    contrast_low: 20.0
    entropy_low: 3.0
    noise_high: 50.0
    compression_quality_low: 50
    min_resolution: [100, 100]
    max_resolution: [4000, 4000]
    aspect_ratio_range: [0.33, 3.0]
  review_threshold_multiplier: 1.2
  move_flagged: false

phase4_object_validation:
  enabled: true
  methods:
    color_segmentation:
      enabled: true
      hsv_ranges:
        - {h_min: 30, h_max: 90, s_min: 20, s_max: 255, v_min: 20, v_max: 255}
        - {h_min: 10, h_max: 30, s_min: 30, s_max: 255, v_min: 30, v_max: 255}
      min_fruit_area_ratio: 0.05
      max_fruit_area_ratio: 0.95
  min_fruit_area_ratio: 0.05
  max_fruit_area_ratio: 0.95
  max_fruits_per_image: 5
  max_occlusion_ratio: 0.5
  max_border_touch_ratio: 0.1
  max_background_ratio: 0.8
  generate_warnings: false

phase5_standardization:
  enabled: true

phase6_organization:
  enabled: true
  preserve_class_labels: true

phase7_analysis:
  enabled: true
  generate_visualizations: true
  plot_style: "seaborn-v0_8-whitegrid"
  figure_dpi: 150

phase8_reports:
  enabled: true
  formats: ["csv", "txt"]

phase9_validation:
  enabled: true

processing:
  batch_size: 32
  num_workers: 4
  use_gpu: false
  skip_existing: true
  continue_on_error: true

reproducibility:
  seed: 42
  hash_algorithm: "sha256"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/pipeline.log"
  console: true
